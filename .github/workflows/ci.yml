name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src tests

      - name: Ruff format check
        run: ruff format --check src tests

      - name: Mypy
        run: mypy src/pytableau

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest --cov=pytableau --cov-report=term-missing

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage

  hyper:
    name: Hyper integration (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Hyper and development dependencies
        run: pip install -e ".[dev,hyper]"

      - name: Exercise real Hyper operations
        run: pytest -m requires_hyper

  package:
    name: Docs, build and installed-wheel example (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install documentation and build tools
        run: pip install build mkdocs 'mkdocstrings[python]' -e '.[dev]'
      - name: Strict documentation build
        run: mkdocs build --strict
      - name: Build distribution
        run: python -m build
      - name: Exercise core workflow from installed wheel without extras
        run: |
          python -m venv /tmp/pytableau-wheel
          /tmp/pytableau-wheel/bin/pip install dist/pytableau-*.whl
          /tmp/pytableau-wheel/bin/python examples/12_workbook_engineering.py --output /tmp/pytableau-example
