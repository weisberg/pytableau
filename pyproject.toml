[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pytableau"
version = "1.0.1"
description = "The unified Python SDK for Tableau workbook engineering"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["tableau", "workbook", "twb", "twbx", "hyper", "data", "visualization"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["lxml>=4.9"]

[project.optional-dependencies]
cli      = ["tooli>=6.6.0"]
hyper    = ["tableauhyperapi>=0.0.19", "pantab>=5.0"]
pandas   = ["pandas>=2.0"]
server   = ["tableauserverclient>=0.30", "requests>=2.28"]
analysis   = ["lark>=1.1", "networkx>=3.0", "jinja2>=3.0"]
governance = ["pyyaml>=6.0"]
testing    = ["pytest>=8.0"]
all        = ["pytableau[cli,hyper,pandas,server,analysis,governance,testing]"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.8",
    "ruff>=0.3",
    "pre-commit>=3.0",
    "lxml-stubs",
    "tooli>=6.6.0",
    "lark>=1.1",
    "requests>=2.28",
    "pyyaml>=6.0",
]

[project.scripts]
pytableau = "pytableau.cli.main:app"

[project.entry-points."pytest11"]
tableau = "pytableau.testing.plugin"

[project.urls]
Homepage = "https://github.com/weisberg/pytableau"
Repository = "https://github.com/weisberg/pytableau"
"Bug Tracker" = "https://github.com/weisberg/pytableau/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pytableau"]
include = ["src/pytableau/**/*.twb"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["pytableau"]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
packages = ["pytableau"]

[[tool.mypy.overrides]]
module = ["tableauhyperapi.*", "pantab.*", "tableauserverclient.*"]
ignore_missing_imports = true

# Pre-existing type errors carried over from v0.9.0 — tracked for future cleanup.
[[tool.mypy.overrides]]
module = [
    "pytableau.calculations.parser",
    "pytableau.cli.main",
    "pytableau.core.dashboard",
    "pytableau.core.datasource",
    "pytableau.core.fields",
    "pytableau.core.filters",
    "pytableau.core.workbook",
    "pytableau.core.worksheet",
    "pytableau.data.bridge",
    "pytableau.data.extract",
    "pytableau.inspect.catalog",
    "pytableau.inspect.complexity",
    "pytableau.package.manager",
    "pytableau.package.promotion",
    "pytableau.server.client",
    "pytableau.server.metadata",
    "pytableau.server.workflows",
    "pytableau.templates.engine",
    "pytableau.xml.canonical",
    "pytableau.xml.discovery.corpus",
    "pytableau.xml.engine",
]
ignore_errors = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"
pythonpath = ["src"]
markers = [
    "requires_hyper: tests that require optional hyper/pandas dependencies",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["pytableau"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.uv.sources]
tooli = { path = "../tooli" }
